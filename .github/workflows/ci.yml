name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest httpx

      - name: Run the test suite
        # The committed artifacts mean the model loads without retraining,
        # so CI exercises the same files that ship to production.
        env:
          TF_CPP_MIN_LOG_LEVEL: "3"
        run: pytest backend/tests -v

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [api, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t churn-radar:ci .

      - name: Boot it and check the health endpoint
        run: |
          docker run -d --name churn -p 8000:8000 churn-radar:ci
          for i in $(seq 1 40); do
            if curl -fs localhost:8000/api/health | grep -q '"model_loaded":true'; then
              echo "API is up"
              curl -fs localhost:8000/api/health
              exit 0
            fi
            sleep 5
          done
          echo "API did not become healthy in time"
          docker logs churn
          exit 1
